[package]
name = "just-video"
version = "0.1.0"
edition = "2024"
publish = false
description = "Standalone Steam Frame VR video player reading directly from SMB shares"
default-run = "just-video"

[features]
default = ["decode"]
# Links FFmpeg (libavformat/libavcodec/libavutil) through the native C shims.
decode = []

[[bin]]
name = "just-video"
path = "src/main.rs"
required-features = ["decode"]

[[bin]]
name = "frame-probe"
path = "src/bin/frame-probe.rs"

[dependencies]
anyhow = "1"
ash = "0.38"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
libloading = "0.9"
openxr = "0.22"
png = "0.18"
fontdue = "0.9"
ctrlc = "3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smb = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
# The Meta Quest build: NativeActivity glue, and AAudio for sound.
android-activity = { version = "0.6.1", features = ["native-activity"] }
ndk = { version = "0.9", features = ["audio", "api-level-29"] }

[build-dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# TCP_NODELAY fix (see third_party/smb-transport/PATCHED.md).
smb-transport = { path = "third_party/smb-transport" }
# Credit leak on async (STATUS_PENDING) responses (see third_party/smb/PATCHED.md).
smb = { path = "third_party/smb" }
